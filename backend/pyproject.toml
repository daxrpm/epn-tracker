[project]
name = "epn-backend"
version = "0.1.0"
description = "Backend del sistema EPN Notas Mallas (FastAPI, arquitectura fba + dominio puro)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "aioboto3>=13",
    "pypdf>=5",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "fakeredis>=2.36.2",
    "mypy>=2.3.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated migrations keep whatever Alembic emitted; hand-written ones follow the same style
# as the rest of the code, so only the auto-generated bodies are excluded from linting.
extend-exclude = ["alembic/versions"]

[tool.ruff.format]
# One formatter, no debate. `docstring-code-format` keeps the examples inside docstrings
# consistent with the code around them.
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "TID"]
ignore = ["B008"]  # FastAPI usa llamadas en defaults (Depends)

[tool.ruff.lint.isort]
known-first-party = ["app", "seeds", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Fail on an unraisable warning rather than letting it scroll past.
filterwarnings = ["error::RuntimeWarning"]

[tool.mypy]
python_version = "3.12"
files = ["app", "seeds"]
# Pragmatic rather than strict: the value here is catching a wrong attribute or a None that is
# not handled, not annotating every local. Tightening happens module by module, not by flipping
# `strict` and drowning in noise.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Alembic revision files are generated and are not part of the app's type surface.
module = "alembic.*"
ignore_errors = true
