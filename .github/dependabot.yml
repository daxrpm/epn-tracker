version: 2

# Actualizaciones agrupadas y semanales. Sin agrupar, un repo con estas dependencias genera
# más PRs de los que nadie revisa, y los PRs que nadie revisa se mergean sin mirar.
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
      # React y Radix se mueven juntos; separarlos produce PRs que no compilan por su cuenta.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "radix-ui"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
    commit-message:
      prefix: "chore(docker)"
